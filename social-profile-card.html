<!DOCTYPE html>
<html>
    <head>
        <title>Social Profile</title>
        <style>
            p{
                font-family: Inter;
                text-align: center;
            }
            body
            {
                background-color: rgb(23, 21, 21);
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .content
            {
                display: flex;
                flex-direction: column;
                background-color: rgb(37, 35, 35);
                justify-content: center;
                align-items: center;
                width: 310px;
                border-radius: 15px;
            }
            .profile-pic
            {
                height: 70px;
                width: 70px;
                border-radius: 35px;
                margin-top: 20px;
            }
            .name
            {
                font-size: 24px;
                color: white;
                margin-top: 20px;
                margin-bottom: 8px;
            }
            .place
            {
                font-size: 14px;
                font-weight: 600;
                color: greenyellow;
                margin-top: 0;
                margin-bottom: 0;
            }
            .info
            {
                margin-top: 20px;
                font-size: 12px;
                color: white;
                margin-bottom: 20px;
            }
            .buttons
            {
                display: flex;
                flex-direction: column;
                justify-content: center; /* Centers text vertically */
                align-items: center;
                row-gap: 10px;
                margin-left: 30px;
                margin-right: 30px;
                margin-bottom: 30px;
            }
            button
            {
                font-size: 11px;
                color: white;
                font-weight: 600;
                height: 38px;
                width: 250px;
                background-color: rgb(51, 51, 51);;
                border: none;
                border-radius: 7px;
                transition: background color 0.15s;
            }
            button:hover
            {
                color: black;
                background-color: greenyellow;
                cursor: pointer;
            }
            .credits
            {
                width: 310px;
                font-size: 12px;
                color: rgb(173, 169, 169);
                font-weight: 500;
            }
            span
            {
                cursor: pointer;
                text-decoration: underline;
            }
            span:hover
            {
                color: greenyellow;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <div>
                <img class="profile-pic" src="images/avatar-jessica.jpeg" alt="profile-pic">
            </div>
            <div>
                <p class="name">Jessica Randall</p>
                <p class="place">London, United Kingdom</p>
                <p class="info">"Font-end developer and avid reader."</p>
            </div>
            <div class="buttons">
                <button>GitHub</button>
                <button>Fronted Mentor</button>
                <button>Linkedln</button>
                <button>Twitter</button>
                <button>Instagram</button>
            </div>
        </div>
        <div class="credits">
            <p>Challenge by <span>Fronted Mentor</span> &#183; Coded by <span class="coder">Kartik Kumar</span></p>
        </div>
    </body>
</html>
